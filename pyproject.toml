[project]
name = "cioos-metadata-conversion"
version = "0.1.0"
description = ""
authors = [{ name = "Jessy Barrette", email = "30420025+JessyBarrette@users.noreply.github.com" }]
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "loguru>=0.7.2,<0.8",
    "requests>=2.32.3,<3",
    "cffconvert>=2.0.0,<3",
    "pycountry>=24.6.1,<25",
    "pyyaml>=6.0.1,<7",
    "lxml>=5.2.2,<6",
    "metadata-xml @ git+https://github.com/cioos-siooc/metadata-xml.git",
    "click>=7,<9",
    "datacite>=1.2.0",
    "python-dotenv>=1.1.0",
    "google-auth>=2.40.3",
    "google-oauth>=1.0.1",
    "duckdb>=1.0.0",
    "deepdiff>=8.6.1",
]

[project.scripts]
cioos_metadata_conversion = "cioos_metadata_conversion.__main__:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2,<9",
    "ruff>=0.5.0,<0.6",
    "pytest-xdist>=3.6.1,<4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
# Allow the metadata-xml git direct reference in project.dependencies.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["cioos_metadata_conversion"]
# Ship the bundled JSON vocabularies as package data. `artifacts` guarantees
# they are included even when untracked by git (e.g. platforms.json).
artifacts = ["cioos_metadata_conversion/resources/*.json"]

[tool.hatch.build.targets.sdist]
artifacts = ["cioos_metadata_conversion/resources/*.json"]
