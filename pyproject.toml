[project]
name = "cioos-metadata-conversion"
version = "0.1.0"
description = ""
authors = [{ name = "Jessy Barrette", email = "30420025+JessyBarrette@users.noreply.github.com" }]
requires-python = "~=3.11"
readme = "README.md"
dependencies = [
    "loguru>=0.7.2,<0.8",
    "requests>=2.32.3,<3",
    "cffconvert>=2.0.0,<3",
    "pycountry>=24.6.1,<25",
    "pyyaml>=6.0.1,<7",
    "lxml>=5.2.2,<6",
    "metadata-xml",
    "click>=7,<9",
    "datacite>=1.2.0",
    "python-dotenv>=1.1.0",
    "google-auth>=2.40.3",
    "google-oauth>=1.0.1",
]

[project.scripts]
cioos_metadata_conversion = "cioos_metadata_conversion.__main__:cli"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2.2,<9",
    "ruff>=0.5.0,<0.6",
    "pytest-xdist>=3.6.1,<4",
    "pre-commit>=4.3.0",
]

[tool.uv.sources]
metadata-xml = { git = "https://github.com/cioos-siooc/metadata-xml.git" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
extend-exclude = ["build", "dist"]
unsafe-fixes = false
select = [
  "E", "F", "W",        # pycodestyle/pyflakes
  "B",                  # flake8-bugbear
  "I",                  # import sorting
  "UP",                 # pyupgrade
  "N",                  # naming
  "S",                  # bandit-lite (optional)
  "BLE",                # blind except
  "C4",                 # comprehensions
  "PIE",
  "T20",                # print
  "RUF"
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S603", "S607"]   # allow asserts in tests
