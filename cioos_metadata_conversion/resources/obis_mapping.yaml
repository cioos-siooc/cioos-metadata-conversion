# ══════════════════════════════════════════════════════════════════════════
# OBIS → CIOOS metadata mapping
#
# Single source of truth for every value the OBIS loader emits.  Consumed by
# cioos_metadata_conversion/load_from/obis.py.  The rule is: every VALUE lives
# here, all CONTROL FLOW lives in obis.py.  Nothing in this file is executed;
# it is data, and the loader validates it at import.
#
# Editing notes:
#   * UTF-8. Seven measurement terms and two guard patterns contain accented
#     characters that are load-bearing — do not let an editor re-encode or
#     NFD-normalise them.
#   * Regex patterns are SINGLE-QUOTED so backslashes stay literal. In a
#     double-quoted YAML scalar "\b" silently becomes U+0008 BACKSPACE.
#   * Duplicate keys are rejected at load; PyYAML would otherwise last-win.
#   * Sections marked `order_sensitive: true` are matched first-hit-wins.
#     Reordering them changes output.
# ══════════════════════════════════════════════════════════════════════════
version: 1

# ── 1. Record fields ──────────────────────────────────────────────────────
# One entry per key emitted by map_obis_to_cioos. The order of this section IS
# the emitted key order (observable: record.py:23 json.dumps has no sort_keys).
# Entry kinds:
#   source:   read this OBIS field (a list means try each in turn)
#   constant: emit this literal
#   handler:  named function in obis.py owns the control flow
# `transform` names a function in obis.py's transform registry.
fields:
  abstract: {source: abstract, transform: add_fr, default: ""}

  # Only set when the dataset has a real DOI. citation_id is used only when
  # it is itself a DOI ("doi.org/" in it, or the "10." prefix). The
  # metadata-xml template emits a bare cit:identifier with no mcc:authority
  # and the CKAN harvester defaults unqualified identifiers to doi.org, so a
  # bare UUID would produce a broken doi.org/<UUID> link.
  datasetIdentifier: {source: [doi, citation_id], handler: dataset_identifier}
  title: {source: title, transform: add_fr, default: ""}
  license: {source: intellectualrights, default: ""}
  category: {constant: "dataset"}
  comment: {constant: ""}

  # List items may be a dict with a `keyword` key or a bare string. OBIS only
  # provides English keywords; they are reused as the French placeholders
  # since most are scientific terms or proper nouns that don't change.
  keywords: {source: keywords, handler: keywords}
  associated_resources: {handler: associated_resources, reads: templates.associated_resources}
  contacts: {source: contacts, handler: contacts, reads: contacts}

  # Falls back to `updated` so metadata.dates always survives scrub_dict,
  # which strips empty values and would otherwise leave the XML dateless.
  created: {source: [created, updated], transform: iso_date, handler: first_present}
  dateStart: {constant: ""}   # temporal extent of collection: not in OBIS metadata
  dateEnd: {constant: ""}
  datePublished: {source: [published, updated], transform: iso_date, handler: first_present}
  dateRevised: {source: updated, transform: iso_date}

  # OBIS extent is a WKT POLYGON.
  map: {source: extent, handler: extent_to_map}
  distribution: {handler: distribution, reads: templates.distribution}
  metadataScope: {constant: "Dataset"}
  resourceType: {constant: "Dataset"}
  doiCreationStatus: {constant: ""}
  edition: {constant: ""}
  filename: {constant: ""}
  identifier: {constant: ""}
  progress: {constant: ""}
  recordID: {constant: ""}
  status: {constant: ""}
  userID: {constant: ""}
  lastEditedBy: {constant: {displayName: "", email: ""}}
  language: {constant: "en"}

  # NOT a bare "": add_fr's French placeholder is what lets this survive
  # scrub_dict, and firebase_to_cioos.py:206 reads it.
  limitations: {constant: "", transform: add_fr}
  noTaxa: {constant: true}    # OBIS metadata doesn't include taxon lists
  noVerticalExtent: {constant: true}    # vertical extent not in OBIS metadata
  verticalExtentDirection: {constant: ""}   # e.g. "depthPositive"
  timeFirstPublished: {handler: same_as_date_published}

  # Derived, not copied. Merges the taxonomy signal (from_taxon_class, via
  # the facet API or the per-dataset parquet) with the eMoF signal
  # (from_p01_code + from_measurement_text). The taxonomy "other" fallback
  # is dropped when measurement EOVs landed, so we never emit a misleading
  # pair like ["other", "seaSurfaceTemperature"].
  # The gates below run in sequence and a LATER GATE CAN RETRACT an EOV an
  # earlier one added — the benthic-indicator gate discards
  # invertebrateAbundanceAndDistribution. See eov.gates.
  # Abstract / title / keyword NLP is deliberately out of scope: a separate
  # AI-backed tool handles abstract-based inference and mixing the two
  # produces inconsistent tagging.
  eov: {handler: eov_from_signals}

  # OBIS exposes no structured platform field; DwC samplingProtocol on
  # occurrence records is the only reliable signal, so a no-hit result is
  # the common case.
  platforms: {source: id, handler: platforms, reads: platforms}

  # True when platforms came back empty, which makes
  # firebase_to_cioos.py:318 skip the platform path so the XML omits the
  # section. Must stay a real bool.
  noPlatform: {handler: no_platform}
  projects: {constant: []}     # project information not available from OBIS
  region: {constant: ""}     # geographic region classification

# ── 2. Literal templates for list-valued fields ───────────────────────────
# The strings live here; the conditions are named here and implemented in
# obis.py. Note the two shapes differ: associated_resources carries the source
# value in `code`, while distribution carries it in `url` and add_fr-wraps its
# LITERAL name and description.
templates:
  associated_resources:
    defaults: {association_type_iso: crossReference, authority: URL}
    entries:
      - {when: url, source: url,
         title: 'Primary dataset URL', association_type: IsIdenticalTo}
      - {when: archive_differs_from_url, source: archive,
         title: 'Dataset archive', association_type: IsIdenticalTo}
      - {when: feed_url, source: feed.url,
         title: 'Metadata feed source', association_type: IsIdenticalTo}
      - {when: each_tag, source: tags,
         title: 'OBIS Dataset Type vocabulary term', association_type: IsDescribedBy}
  distribution:
    add_fr_fields: [name, description]
    entries:
      - when: archive
        source: archive
        name: 'Darwin Core Archive'
        description: 'Download the complete Darwin Core Archive dataset'
      - when: url_differs_from_archive
        source: url
        name: 'IPT Resource Page'
        description: 'View dataset metadata and access options via the Integrated Publishing Toolkit'

# ── 3. Contacts ───────────────────────────────────────────────────────────
# A contact with no givenname/surname/organization is SKIPPED: it would produce
# empty individual/organization dicts that crash the XML template once
# scrub_dict has removed all the empty values.
#
# IMPORTANT when reading `roles` below: promote_custodian appends "custodian"
# to contacts[0].role when no contact already has it, because metadata-xml only
# emits mdb:contact for custodians and ISO 19115-3 requires it. So a contact
# whose OBIS type was "creator" can end up [author, custodian] — the roles
# table alone does not predict the output.
contacts:
  field_map:
    givenname: givenNames
    surname: lastName
    organization: orgName
    url: orgURL
  # Emitted only when the OBIS contact actually carries them.
  optional_field_map:
    email: indEmail
    position: indPosition
  # indName is composed from givenname + surname.
  constants:
    indOrcid: ""
    inCitation: true      # default to true for creators/authors
    orgAddress: ""
    orgCity: ""
    orgCountry: ""
    orgRor: ""
  promote_custodian: true

# ── 4. EOV vocabularies ───────────────────────────────────────────────────
# Every value here must exist in resources/eov.json (`value` field); a test
# enforces it.
eov:

  # OBIS /v3/facet?facets=class values → CIOOS EOV. Exact-case keys, exact-key
  # lookup, so order is irrelevant in this section.
  from_taxon_class:

    # ── Fish ──
    Actinopterygii: fishAbundanceAndDistribution
    Teleostei: fishAbundanceAndDistribution
    Elasmobranchii: fishAbundanceAndDistribution
    Chondrichthyes: fishAbundanceAndDistribution
    Myxini: fishAbundanceAndDistribution
    Petromyzonti: fishAbundanceAndDistribution
    Holocephali: fishAbundanceAndDistribution
    Chondrostei: fishAbundanceAndDistribution
    Ichthyostraca: fishAbundanceAndDistribution
    Holostei: fishAbundanceAndDistribution
    Coelacanthi: fishAbundanceAndDistribution
    Dipneusti: fishAbundanceAndDistribution

    # ── Marine turtles, birds, mammals ──
    Mammalia: marineTurtlesBirdsMammalsAbundanceAndDistribution
    Aves: marineTurtlesBirdsMammalsAbundanceAndDistribution
    Reptilia: marineTurtlesBirdsMammalsAbundanceAndDistribution

    # ── Phytoplankton — photosynthetic algae & cyanobacteria ──
    Bacillariophyceae: phytoplanktonBiomassAndDiversity
    Dinophyceae: phytoplanktonBiomassAndDiversity
    Coscinodiscophyceae: phytoplanktonBiomassAndDiversity
    Mediophyceae: phytoplanktonBiomassAndDiversity
    Fragilariophyceae: phytoplanktonBiomassAndDiversity
    Cyanophyceae: phytoplanktonBiomassAndDiversity
    Prymnesiophyceae: phytoplanktonBiomassAndDiversity
    Coccolithophyceae: phytoplanktonBiomassAndDiversity
    Chrysophyceae: phytoplanktonBiomassAndDiversity
    Cryptophyceae: phytoplanktonBiomassAndDiversity
    Prasinophyceae: phytoplanktonBiomassAndDiversity
    Raphidophyceae: phytoplanktonBiomassAndDiversity
    Dictyochophyceae: phytoplanktonBiomassAndDiversity
    Euglenoidea: phytoplanktonBiomassAndDiversity
    Euglenophyceae: phytoplanktonBiomassAndDiversity
    Xanthophyceae: phytoplanktonBiomassAndDiversity
    Chlorophyceae: phytoplanktonBiomassAndDiversity
    Chlorodendrophyceae: phytoplanktonBiomassAndDiversity
    Trebouxiophyceae: phytoplanktonBiomassAndDiversity
    Zygnematophyceae: phytoplanktonBiomassAndDiversity

    # New phytoplankton additions (from OBIS facet data)
    Pyramimonadophyceae: phytoplanktonBiomassAndDiversity
    Mamiellophyceae: phytoplanktonBiomassAndDiversity
    'Cryptophyta incertae sedis': phytoplanktonBiomassAndDiversity
    Pelagophyceae: phytoplanktonBiomassAndDiversity
    Eustigmatophyceae: phytoplanktonBiomassAndDiversity
    Bolidophyceae: phytoplanktonBiomassAndDiversity
    Pavlovophyceae: phytoplanktonBiomassAndDiversity
    Prasinodermatophyceae: phytoplanktonBiomassAndDiversity
    Nephroselmidophyceae: phytoplanktonBiomassAndDiversity
    Pinguiophyceae: phytoplanktonBiomassAndDiversity
    Synurophyceae: phytoplanktonBiomassAndDiversity
    'Haptophyta incertae sedis': phytoplanktonBiomassAndDiversity
    'Dinoflagellata incertae sedis': phytoplanktonBiomassAndDiversity
    Chlorarachnea: phytoplanktonBiomassAndDiversity
    Chlorarachniophyceae: phytoplanktonBiomassAndDiversity
    Glaucophyceae: phytoplanktonBiomassAndDiversity
    Charophyceae: phytoplanktonBiomassAndDiversity

    # ── Zooplankton — planktonic heterotrophs, ciliates, rotifers, jellyfish ──
    Hexanauplia: zooplanktonBiomassAndDiversity
    Copepoda: zooplanktonBiomassAndDiversity
    Branchiopoda: zooplanktonBiomassAndDiversity
    Ostracoda: zooplanktonBiomassAndDiversity
    Scyphozoa: zooplanktonBiomassAndDiversity
    Hydrozoa: zooplanktonBiomassAndDiversity
    Appendicularia: zooplanktonBiomassAndDiversity
    Thaliacea: zooplanktonBiomassAndDiversity
    Sagittoidea: zooplanktonBiomassAndDiversity
    Choanoflagellatea: zooplanktonBiomassAndDiversity
    Oligotrichea: zooplanktonBiomassAndDiversity
    Heterotrichea: zooplanktonBiomassAndDiversity
    Prostomatea: zooplanktonBiomassAndDiversity
    Oligohymenophorea: zooplanktonBiomassAndDiversity
    Globothalamea: zooplanktonBiomassAndDiversity
    Tubothalamea: zooplanktonBiomassAndDiversity
    Nodosariata: zooplanktonBiomassAndDiversity
    Monothalamea: zooplanktonBiomassAndDiversity
    Tubulinea: zooplanktonBiomassAndDiversity
    'Foraminifera incertae sedis': zooplanktonBiomassAndDiversity

    # New zooplankton additions (from OBIS facet data)
    Polycystina: zooplanktonBiomassAndDiversity   # Radiolaria
    Litostomatea: zooplanktonBiomassAndDiversity   # Ciliates
