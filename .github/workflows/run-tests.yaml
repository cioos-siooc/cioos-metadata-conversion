name: Run Tests

on:
  push:
    branches:
      - main
      - development
  pull_request:
    branches:
      - main
      - development

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: "."
      # - name: Checkout cioos metadata files
      #   uses: actions/checkout@v4
      #   with:
      #     repository: cioos-siooc/cioos-metadata-entry-form-files
      #     path: ./tests/records/cioos-metadata-entry-form-files

      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: "Set up Python"
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Run pytest
        run: uv run pytest

      # pytest runs against an editable install, so Path(__file__) always
      # resolves into the source tree and hatchling's file-selection rules are
      # never exercised. Without this step a resources/ file that is missing
      # from the wheel — because it was never git-added, or because a glob
      # stopped matching it — passes every test and only breaks on install.
      - name: Check bundled resources are in the wheel
        run: |
          uv build --wheel
          uv run python - <<'PY'
          import glob
          import sys
          import zipfile

          required = [
              "obis_mapping.yaml",
              "eov_to_keywords.yaml",
              "eov.json",
              "epsg.json",
              "licenses.json",
              "platforms.json",
          ]
          wheel = sorted(glob.glob("dist/*.whl"))[-1]
          shipped = set(zipfile.ZipFile(wheel).namelist())
          missing = [
              name
              for name in required
              if f"cioos_metadata_conversion/resources/{name}" not in shipped
          ]
          if missing:
              sys.exit(f"{wheel} is missing resources: {missing}")
          print(f"{wheel}: all {len(required)} bundled resources present")
          PY
